<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="100%" height="100%">
  <defs>
    <!-- Градиенты для изометрического знака -->
    <linearGradient id="topPlaneGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="leftStemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="loopFrontGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Мягкая тень под знаком -->
    <filter id="softShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- ФОН (Прозрачный) -->
  <rect width="100%" height="100%" fill="none" />

  <!-- ГРУППА ЗНАКА (P-CUBE WIREFRAME) -->
  <g transform="translate(45, 10)" filter="url(#softShadow)">
    
    <!-- Тень на плоскости пола -->
    <polygon points="105,198 160,166 105,134 50,166" fill="#0F172A" opacity="0.06" />

    <!-- 1. Вертикальная левая грань буквы P (опорная стойка) -->
    <polygon points="40,86 68,70 68,168 40,184" fill="url(#leftStemGrad)" />
    <polygon points="68,70 82,78 82,160 68,168" fill="#1E3A8A" opacity="0.75" />

    <!-- 2. Верхняя плоскость чертежа/планировки (Top Floor Plan) -->
    <polygon points="105,22 170,60 105,98 40,60" fill="url(#topPlaneGrad)" />

    <!-- Сетка CAD на верхней грани -->
    <polyline points="62,47 127,85" stroke="#FFFFFF" stroke-width="1.8" stroke-opacity="0.7" fill="none" />
    <polyline points="83,35 148,72" stroke="#FFFFFF" stroke-width="1.8" stroke-opacity="0.7" fill="none" />
    <polyline points="72,79 137,41" stroke="#FFFFFF" stroke-width="1.8" stroke-opacity="0.7" fill="none" />
    <polyline points="93,91 158,54" stroke="#FFFFFF" stroke-width="1.8" stroke-opacity="0.7" fill="none" />

    <!-- Окантовка верхней грани -->
    <polygon points="105,22 170,60 105,98 40,60" fill="none" stroke="#BAE6FD" stroke-width="2" />

    <!-- 3. Объёмная петля буквы P в изометрии -->
    <polygon points="105,98 142,77 156,85 119,106" fill="#38BDF8" opacity="0.9" />
    <polygon points="119,106 170,76 170,126 119,156" fill="url(#loopFrontGrad)" />
    <polygon points="68,136 119,166 119,146 68,116" fill="url(#cyanAccent)" />
    <polygon points="119,146 148,129 148,115 119,132" fill="#0284C7" />

    <!-- Внутреннее окно петли -->
    <polygon points="82,92 132,121 132,105 82,76" fill="#0F172A" opacity="0.25" />

    <!-- Узловые точки привязки -->
    <circle cx="105" cy="22" r="3.5" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" />
    <circle cx="170" cy="60" r="3" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" />
    <circle cx="40" cy="60" r="3" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" />
    <circle cx="119" cy="156" r="3" fill="#38BDF8" />
  </g>

  <!-- ТЕКСТОВАЯ ЧАСТЬ (PLANEASIER) ВЫРОВНЕНА ПО ЦЕНТРУ ЗНАКА -->
  <g transform="translate(245, 128)">
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Inter', sans-serif">
      <!-- Plan -->
      <tspan x="0" y="0" font-size="70" font-weight="900" letter-spacing="-1.5" fill="#0F172A">Plan</tspan>
      <!-- easier -->
      <tspan font-size="70" font-weight="300" letter-spacing="-0.5" fill="#2563EB">easier</tspan>
    </text>
  </g>
</svg>

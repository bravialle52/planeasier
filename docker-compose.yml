version: '3.8'

services:
  db:
    image: postgres:15
    container_name: planeasier-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1010
      POSTGRES_DB: planeasier
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: planeasier-redis
    ports:
      - "6380:6379"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: planeasier-backend
    ports:
      - "8005:80"
    environment:
      - DATABASE_URL=postgresql://postgres:1010@db:5432/planeasier
      - UPLOAD_DIR=/var/www/html/uploads
    volumes:
      - ./backend:/var/www/html
      - model_uploads:/var/www/html/uploads
    depends_on:
      - db
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: planeasier-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - API_URL=http://backend:80
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  model_uploads:
  frontend_node_modules:

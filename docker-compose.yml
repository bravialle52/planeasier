version: '3.8'

services:
  db:
    image: postgres:15
    container_name: planeasier-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1010
      POSTGRES_DB: planeasier
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: planeasier-redis
    ports:
      - "6380:6379"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: planeasier-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=planeasier
      - MINIO_ROOT_PASSWORD=planeasier123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  create-bucket:
    image: minio/mc:latest
    container_name: planeasier-minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 planeasier planeasier123;
      mc mb local/planeasier-models || true;
      mc anonymous set public local/planeasier-models || true;
      "

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: planeasier-backend
    ports:
      - "8005:80"
    environment:
      - DATABASE_URL=postgresql://postgres:1010@db:5432/planeasier
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=planeasier
      - S3_SECRET_KEY=planeasier123
      - S3_BUCKET=planeasier-models
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - db
      - redis
      - minio
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: planeasier-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - API_URL=http://backend:80
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  frontend_node_modules:
